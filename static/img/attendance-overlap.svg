<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 546" role="img" aria-labelledby="title desc">
  <title id="title">Attendance from three classroom views</title>
  <desc id="desc">Three classroom photo cards show students from left, center, and right angles. Repeated students are outlined with dashed rings and merged into one attendance list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20278f"/><stop offset="1" stop-color="#11184f"/></linearGradient>
    <linearGradient id="ready" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35d49a"/><stop offset="1" stop-color="#22daff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect x="5" y="5" width="830" height="536" rx="34" fill="url(#bg)" stroke="#6272ff" stroke-width="3"/>
  <circle cx="734" cy="76" r="72" fill="#22daff" opacity=".08" filter="url(#glow)"/>
  <text x="34" y="47" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">ONE CLASS, THREE VIEWS</text>
  <text x="34" y="72" fill="#aeb9ff" font-family="Arial,sans-serif" font-size="13">Overlapping faces are matched and counted once</text>
