<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Nexus Attendance logo</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <style>
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
    .hub { animation-delay: 0s; }
    .n1 { animation-delay: .9s; }
    .n2 { animation-delay: 1.0s; }
    .n3 { animation-delay: 1.1s; }
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s ease-out both; }
    .l1 { animation-delay: .4s; }
    .l2 { animation-delay: .5s; }
    .l3 { animation-delay: .6s; }
    .check { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .5s ease-out 1.3s both; }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse 2.6s ease-out 2.1s infinite; }
    .word { animation: slide .8s ease-out both; }
    .w1 { animation-delay: 1.0s; }
    .w2 { animation-delay: 1.3s; }

    @keyframes pop   { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; transform: none !important; }
      .ring { opacity: 0 !important; }
    }
  </style>

  <!-- Icon -->
  <g transform="translate(100 100)">
    <g stroke="url(#g)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
      <line class="line l1" pathLength="1" x1="0" y1="0" x2="0" y2="-62"/>
      <line class="line l2" pathLength="1" x1="0" y1="0" x2="54" y2="31"/>
      <line class="line l3" pathLength="1" x1="0" y1="0" x2="-54" y2="31"/>
    </g>
    <circle class="pop n1" cx="0" cy="-62" r="11" fill="url(#g)"/>
    <circle class="pop n2" cx="54" cy="31" r="11" fill="url(#g)"/>
    <circle class="pop n3" cx="-54" cy="31" r="11" fill="url(#g)"/>

    <circle class="ring" cx="0" cy="0" r="34" fill="none" stroke="url(#g)" stroke-width="3"/>
    <circle class="pop hub" cx="0" cy="0" r="34" fill="url(#g)"/>
    <path class="check" pathLength="1" d="M-15 1 L-4 12 L16 -11" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text class="word w1" x="190" y="100" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#1E1B4B">Nexus</text>
  <text class="word w2" x="190" y="145" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="6" fill="#0891B2">ATTENDANCE</text>
</svg>
